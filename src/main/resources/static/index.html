<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Commerce</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
</head>
<body>
<nav>
    <div id="nav-left">
        <a href="index.html" class="logo" aria-label="Nexus Commerce Home">
            <div class="logo-mark">N</div>
            <span class="logo-text">Nexus<span class="logo-accent">Commerce</span></span>
        </a>

        <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <div id="cart-icon" onclick="openCartModal()" role="button" tabindex="0" aria-label="Shopping cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span id="cart-count" class="cart-count-badge">0</span>
        </div>

        <button id="mobile-menu-toggle" class="mobile-menu-toggle icon-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>

    <div id="nav-right" class="collapsed">
        <div id="admin-panel-btn" style="display: none;">
            <a href="admin.html" class="nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                Admin Panel
            </a>
        </div>
        <div id="auth-nav"></div>
    </div>
</nav>

<div class="page-container">
    <aside id="category-sidebar">
        <div class="sidebar-header">
            <h3>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                Categories
            </h3>
        </div>
        <div id="categories-list">
            <div class="sidebar-loading">
                <div class="loading-spinner"></div>
                <p>Loading categories...</p>
            </div>
        </div>
    </aside>

    <main>
        <div id="search-sort-container" class="search-sort-container">
            <div id="search-container" class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Search products..." class="search-input" aria-label="Search products">
                <button id="search-btn" class="search-btn" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </div>

            <div id="sort-container" class="sort-container">
                <svg class="sort-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="9" x2="20" y2="9"></line>
                    <line x1="4" y1="15" x2="20" y2="15"></line>
                    <line x1="10" y1="3" x2="8" y2="21"></line>
                    <line x1="16" y1="3" x2="14" y2="21"></line>
                </svg>
                <select id="sort-select" class="sort-select" aria-label="Sort products">
                    <option value="">Sort by...</option>
                    <option value="name-asc">Name A-Z</option>
                    <option value="name-desc">Name Z-A</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="date-desc">Newest First</option>
                    <option value="date-asc">Oldest First</option>
                </select>
            </div>
        </div>

        <div id="product-container">
            <div class="loading-container">
                <div class="loading-spinner"></div>
                <p>Loading products...</p>
            </div>
        </div>
    </main>
</div>

<!-- Product Modal -->
<div id="product-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-product-name">Product Name</h2>
            <button class="close-button" onclick="closeModal()" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-image-section">
                <img id="modal-product-image" src="" alt="Product Image" onerror="this.src='/image/placeholder.png';">
            </div>
            <div class="modal-info-section">
                <div class="modal-price">
                    <span id="modal-product-price">$0.00</span>
                </div>
                <div class="modal-stock">
                    <span id="modal-product-stock">In Stock: 0</span>
                </div>
                <div class="modal-description">
                    <h3>Description</h3>
                    <p id="modal-product-description">Product description will appear here...</p>
                </div>
                <div class="quantity-selector">
                    <label for="modal-quantity-input">Quantity:</label>
                    <div class="quantity-controls">
                        <button type="button" class="quantity-btn" onclick="decreaseModalQuantity()">-</button>
                        <input type="number" id="modal-quantity-input" min="1" max="1" value="1">
                        <button type="button" class="quantity-btn" onclick="increaseModalQuantity()">+</button>
                    </div>
                    <div id="modal-stock-warning" class="warning-message" style="display: none;"></div>
                </div>
                <div class="modal-action-buttons">
                    <button id="modal-add-to-cart-btn" class="btn btn-primary" onclick="addModalToCart()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        Add to Cart
                    </button>
                    <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Cart Modal -->
<div id="cart-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content cart-modal-content">
        <div class="modal-header">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                Your Shopping Cart
            </h2>
            <button class="close-button" onclick="closeCartModal()" aria-label="Close cart">&times;</button>
        </div>
        <div class="modal-body">
            <div id="cart-items-container">
                <p id="cart-loading">Loading cart items...</p>
                <div id="cart-items-list"></div>
                <div id="empty-cart-message" style="display: none; text-align: center; padding: 40px 20px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; opacity: 0.5;"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <p style="color: var(--text-tertiary); font-size: 0.95rem;">Your cart is empty</p>
                </div>
            </div>
            <div class="cart-total-section">
                <div class="cart-total-row">
                    <span>Total:</span>
                    <span id="cart-total-amount">$0.00</span>
                </div>
            </div>
            <div class="modal-action-buttons">
                <button id="checkout-btn" class="btn btn-primary" onclick="proceedToCheckout()" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                    Proceed to Checkout
                </button>
                <button class="btn btn-secondary" onclick="closeCartModal()">Continue Shopping</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
