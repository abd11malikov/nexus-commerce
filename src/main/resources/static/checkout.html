<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Nexus Commerce</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
</head>
<body>
<nav>
    <h1>Nexus Shop</h1>
    <div id="auth-nav">
        
    </div>
</nav>

<main>
    <div class="checkout-container">
        <h2>Checkout</h2>

        <div class="checkout-content">
            <div class="checkout-form">
                <h3>Shipping Information</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="shippingAddress">Shipping Address</label>
                        <input type="text" id="shippingAddress" name="shippingAddress" placeholder="Enter your shipping address" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" placeholder="City" required>
                        </div>

                        <div class="form-group">
                            <label for="zipCode">ZIP Code</label>
                            <input type="text" id="zipCode" name="zipCode" placeholder="ZIP Code" required>
                        </div>
                    </div>


                    <h3>Review Your Information</h3>
                    <div class="user-info-review">
                        <p><strong>Name:</strong> <span id="review-name">Loading...</span></p>
                        <p><strong>Email:</strong> <span id="review-email">Loading...</span></p>
                        <p><strong>Phone:</strong> <span id="review-phone">Loading...</span></p>
                    </div>

                    <h3>Payment Information</h3>

                    <div class="form-group">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" name="cardNumber" placeholder="0000 0000 0000 0000" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiryDate">Expiry Date</label>
                            <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required>
                        </div>

                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" name="cvv" placeholder="123" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cardName">Name on Card</label>
                        <input type="text" id="cardName" name="cardName" placeholder="John Doe" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Place Order</button>
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">Back to Cart</button>
                </form>
            </div>

            <div class="order-summary">
                <h3>Order Summary</h3>
                <div id="order-items">
                    <p>Loading order details...</p>
                </div>
                <div class="order-total">
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span id="subtotal-amount">$0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Shipping:</span>
                        <span id="shipping-amount">$0.00</span>
                    </div>
                    <div class="total-row">
                        <span>Tax:</span>
                        <span id="tax-amount">$0.00</span>
                    </div>
                    <div class="total-divider"></div>
                    <div class="total-row total-final">
                        <span>Total:</span>
                        <span id="total-amount">$0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
