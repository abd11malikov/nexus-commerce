<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account · Nexus Commerce</title>
  <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('nexus-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --primary-glow: rgba(79, 70, 229, 0.12);
      --bg: #f0f2f5;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --transition: 250ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --primary-glow: rgba(129, 140, 248, 0.14);
      --bg: #0c0c14;
      --bg-card: #16162a;
      --bg-input: #1e1e36;
      --text-primary: #e8eaf0;
      --text-secondary: #9ca3b4;
      --text-tertiary: #6b7280;
      --border: #2a2a42;
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      background: var(--bg);
      transition: background 0.4s ease, color 0.4s ease;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.22), transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(79, 70, 229, 0.20), transparent 42%);
      z-index: -1;
    }

    .auth-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 430px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      animation: card-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-head { padding: 2.4rem 2.4rem 0.4rem; text-align: center; position: relative; }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 1.6rem; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 11px;
      background: var(--primary-gradient); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.2rem;
      box-shadow: 0 8px 20px var(--primary-glow);
    }
    .brand-name { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.3px; }
    .brand-name span { color: var(--primary); }
    .auth-head h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.4rem; }
    .auth-head p { color: var(--text-secondary); font-size: 0.92rem; }

    .theme-toggle {
      position: absolute; top: 1.2rem; right: 1.2rem;
      width: 38px; height: 38px;
      border: 1px solid var(--border); background: var(--bg-input);
      border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary); transition: all var(--transition);
    }
    .theme-toggle:hover { color: var(--primary); border-color: var(--primary); }
    .theme-toggle svg { width: 18px; height: 18px; }
    .theme-toggle .moon { display: none; }
    [data-theme="dark"] .theme-toggle .sun { display: none; }
    [data-theme="dark"] .theme-toggle .moon { display: block; }

    .auth-body { padding: 1.6rem 2.4rem 2.4rem; }

    .field { margin-bottom: 1.05rem; }
    .field label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap > svg.lead {
      position: absolute; left: 14px; width: 18px; height: 18px;
      color: var(--text-tertiary); pointer-events: none;
    }
    .field input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem; font-family: inherit;
      background: var(--bg-input); color: var(--text-primary);
      transition: all var(--transition);
    }
    .field input::placeholder { color: var(--text-tertiary); }
    .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
    .field input.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12); }
    .toggle-pass {
      position: absolute; right: 8px; background: none; border: none; cursor: pointer;
      color: var(--text-tertiary); padding: 8px; display: flex; align-items: center;
      border-radius: 8px; transition: color var(--transition);
    }
    .toggle-pass:hover { color: var(--primary); }
    .toggle-pass svg { width: 18px; height: 18px; }

    .field-hint { font-size: 0.78rem; margin-top: 0.4rem; color: var(--text-tertiary); min-height: 1rem; }
    .field-hint.error { color: var(--danger); }

    .btn-primary {
      width: 100%; padding: 0.95rem; margin-top: 0.4rem;
      background: var(--primary-gradient); color: #fff; border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: all var(--transition);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px var(--primary-glow); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.7; cursor: progress; transform: none; }

    .divider {
      display: none; align-items: center; gap: 14px; margin: 1.5rem 0;
      color: var(--text-tertiary); font-size: 0.8rem; font-weight: 500;
    }
    .divider.visible { display: flex; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    #google-btn-wrap { display: none; }
    #google-btn-wrap.visible { display: block; }
    #google-btn { display: flex; justify-content: center; min-height: 44px; }
    .google-fallback {
      width: 100%; padding: 0.85rem; gap: 10px;
      display: none; align-items: center; justify-content: center;
      background: var(--bg-input); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.95rem; font-weight: 600; font-family: inherit; cursor: pointer;
      transition: all var(--transition);
    }
    .google-fallback:hover { border-color: var(--primary); background: var(--primary-glow); }

    .alt-line { text-align: center; margin-top: 1.6rem; color: var(--text-secondary); font-size: 0.9rem; }
    .alt-line a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .alt-line a:hover { text-decoration: underline; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 1.4rem;
      color: var(--text-tertiary); font-size: 0.85rem; text-decoration: none;
      width: 100%; justify-content: center; transition: color var(--transition);
    }
    .back-link:hover { color: var(--primary); }
    .back-link svg { width: 15px; height: 15px; }

    .form-error {
      display: none; background: rgba(239, 68, 68, 0.1); color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25); padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1.1rem;
    }
    .form-error.show { display: block; }

    @media (max-width: 480px) {
      .auth-head { padding: 2rem 1.5rem 0.4rem; }
      .auth-body { padding: 1.4rem 1.5rem 2rem; }
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-head">
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" type="button">
      <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="brand">
      <span class="brand-mark">N</span>
      <span class="brand-name">Nexus<span>Commerce</span></span>
    </div>

    <h1>Create your account</h1>
    <p>Join Nexus and start shopping in seconds</p>
  </div>

  <div class="auth-body">
    <div class="form-error" id="form-error" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <div class="input-wrap">
          <svg class="lead" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg class="lead" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="lead" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required>
          <button type="button" class="toggle-pass" onclick="togglePasswordVisibility('password', this)" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="input-wrap">
          <svg class="lead" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
          <button type="button" class="toggle-pass" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-hint" id="match-hint"></div>
      </div>

      <button type="submit" class="btn-primary" id="register-submit">Create Account</button>
    </form>

    <div class="divider" id="auth-divider">OR</div>

    <div id="google-btn-wrap">
      <div id="google-btn"></div>
      <button type="button" class="google-fallback" id="google-fallback" onclick="promptGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>
    </div>

    <div class="alt-line">
      Already have an account? <a href="login.html">Sign in</a>
    </div>

    <a href="index.html" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to store
    </a>
  </div>
</div>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
