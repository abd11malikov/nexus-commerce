<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Nexus Commerce</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
</head>
<body>
<nav>
    <div id="nav-left">
        <h1>Nexus Commerce Shop</h1>
    </div>
    <div id="nav-right">
        <div id="cart-icon" onclick="openCartModal()" style="cursor: pointer; position: relative; margin-right: 20px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span id="cart-count" class="cart-count-badge">0</span>
        </div>
        <div id="auth-nav">
            
        </div>
    </div>
</nav>

<main>
    <div class="admin-dashboard">
        <h2>Admin Dashboard</h2>
        
        <div class="admin-options">
            <div class="admin-option" onclick="showAddProductForm()">
                <h3>Add New Product</h3>
                <p>Add a new product to the store</p>
            </div>
            <div class="admin-option" onclick="showUpdateProductForm()">
                <h3>Update Product</h3>
                <p>Modify existing product details</p>
            </div>
            <div class="admin-option" onclick="showManageOrdersForm()">
                <h3>Manage Orders</h3>
                <p>Change order statuses</p>
            </div>
        </div>
        
        <div id="admin-form-container">
            
        </div>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
